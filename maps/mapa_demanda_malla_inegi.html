    let handleObject = feature => {
        if (feature === null) {
            return '';
        } else if (typeof(feature)=='object') {
            return JSON.stringify(feature);
        } else {
            return feature;
        }
    }
    let fields = ["CODIGO", "POBTOT", "fraccion_area_cubierta", "POBTOT_prorrateada"];
    let aliases = ["Celda:", "Poblaci\u00f3n de la celda:", "Fracci\u00f3n dentro de buffers:", "Poblaci\u00f3n prorrateada:"];

        String(
        fields.map(
        (v,i)=>
        `<tr>
            <th>${aliases[i].toLocaleString()}</th>
            
            <td>${handleObject(layer.feature.properties[v]).toLocaleString()}</td>
        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }
